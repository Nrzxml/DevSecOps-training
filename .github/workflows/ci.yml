name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - run: PYTHONPATH=. pytest

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev requirements
        run: |
          pip install -r dev-requirements.txt

      - name: Run Bandit SAST
        run: |
          bandit -r .

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt
          pip install pip-audit
          pip-audit

  secret_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          apt-get update
          apt-get install -y gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

  build_and_push:
    runs-on: ubuntu-latest

    needs:
      - test
      - sast
      - sca
      - secret_scan

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:latest .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:${{ github.sha }}

  image_scan:
    runs-on: ubuntu-latest

    needs: build_and_push

    steps:
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/notes-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'